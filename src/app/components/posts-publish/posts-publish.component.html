<div class="posts-publish-container px-5">
  <div class="row">
    <div class="offset-md-1 col-md-10">
      <div class="post-publish">
        <form #postForm="ngForm" (ngSubmit)="onSubmit(postForm, $event)">

          <div class="composer-header">
            <div class="avatar-sm">
              <img src="{{url + 'get-image-user/' + identity.image}}" *ngIf="identity.image" />
              <img src="assets/user.png" *ngIf="!identity.image" />
            </div>
            <div>
              <div class="composer-name">{{ identity.name + ' ' + identity.surname }}</div>
              <div class="composer-prompt">What are you thinking?</div>
            </div>
          </div>

          <textarea
            name="text"
            class="composer-textarea"
            [(ngModel)]="publication.text"
            placeholder="Share something..."
            required
          ></textarea>

          <div class="composer-actions">
            <label class="attach-btn" for="fileUpload">
              <i class="bi bi-image"></i> Photo
              <input id="fileUpload" type="file" style="display:none" (change)="fileChangeEvent($event)" />
            </label>
            <button type="submit" class="publish-btn" [disabled]="!postForm.form.valid">Publish</button>
          </div>

        </form>

        <div class="alert alert-success mt-2" *ngIf="status == 'success'">Published successfully!</div>
        <div class="alert alert-danger mt-2" *ngIf="status == 'error'">Oops, something went wrong!</div>
      </div>
    </div>
  </div>
</div>
